name: QA Gates

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install flake8
        run: python -m pip install flake8==7.4.1

      - name: Run flake8
        run: python -m flake8 .

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install coverage
        run: python -m pip install coverage==7.16.2

      - name: Run tests with branch coverage
        run: >-
          python -m coverage run --branch --source=src
          -m unittest discover -s tests -v

      - name: Require coverage above 80 percent
        run: python -m coverage report -m --fail-under=81
